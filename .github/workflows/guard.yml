# autopilot-kit reusable workflow: required status check "guard". Deterministic, zero tokens.
# The logic comes from the pinned kit sha (a PR cannot weaken it); the config is read from the base branch.
name: guard

on:
  workflow_call:
    inputs:
      kit_repo: {type: string, required: true}
      kit_ref:  {type: string, required: true}

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      HEAD_REF: ${{ github.head_ref || github.ref_name }}
      BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: fetch kit (pinned, verified)
        env:
          KIT_REPO: ${{ inputs.kit_repo }}
          KIT_REF: ${{ inputs.kit_ref }}
        run: |
          case "$KIT_REF" in ""|*[!0-9a-f]*) echo "::error::kit_ref must be a full commit sha"; exit 1;; esac
          [ "${#KIT_REF}" = 40 ] || { echo "::error::kit_ref must be 40 hex chars"; exit 1; }
          case "$KIT_REPO" in */*) ;; *) echo "::error::kit_repo must be owner/name"; exit 1;; esac
          D="$RUNNER_TEMP/kit"
          git init -q "$D"
          git -C "$D" fetch -q --depth 1 "https://github.com/${KIT_REPO}.git" "$KIT_REF"
          git -C "$D" checkout -q FETCH_HEAD
          [ "$(git -C "$D" rev-parse HEAD)" = "$KIT_REF" ] || { echo "::error::kit sha mismatch"; exit 1; }
          echo "KIT=$D" >> "$GITHUB_ENV"
      - run: pip install --quiet pyyaml
      - name: run guard
        run: |
          AGENT=false
          case "$HEAD_REF" in agent/*|claude/*) AGENT=true ;; esac
          git show "origin/$BASE_REF:.autopilot/repo.yaml" > "$RUNNER_TEMP/repo.yaml" 2>/dev/null || cp .autopilot/repo.yaml "$RUNNER_TEMP/repo.yaml"
          python "$KIT/runtime/guard.py" --base "origin/$BASE_REF" --head HEAD --agent "$AGENT" --config "$RUNNER_TEMP/repo.yaml"

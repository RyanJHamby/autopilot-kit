# autopilot-kit reusable workflow: keeps open agent/* PRs mergeable. update-branch when behind; when conflicting, label
# needs-rebase and re-dispatch the implementer through the normal gate. Zero tokens unless a conflict needs the agent.
name: rebase

on:
  workflow_call:
    inputs:
      kit_repo: {type: string, required: true}
      kit_ref:  {type: string, required: true}

permissions: {}

jobs:
  rebase:
    if: vars.AUTOPILOT_ENABLED == 'true' && vars.AUTOPILOT_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AUTOPILOT_HOLD_UNTIL: ${{ vars.AUTOPILOT_HOLD_UNTIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: fetch kit (pinned, verified)
        env:
          KIT_REPO: ${{ inputs.kit_repo }}
          KIT_REF: ${{ inputs.kit_ref }}
        run: |
          case "$KIT_REF" in ""|*[!0-9a-f]*) echo "::error::kit_ref must be a full commit sha"; exit 1;; esac
          [ "${#KIT_REF}" = 40 ] || { echo "::error::kit_ref must be 40 hex chars"; exit 1; }
          case "$KIT_REPO" in */*) ;; *) echo "::error::kit_repo must be owner/name"; exit 1;; esac
          D="$RUNNER_TEMP/kit"
          git init -q "$D"
          git -C "$D" fetch -q --depth 1 "https://github.com/${KIT_REPO}.git" "$KIT_REF"
          git -C "$D" checkout -q FETCH_HEAD
          [ "$(git -C "$D" rev-parse HEAD)" = "$KIT_REF" ] || { echo "::error::kit sha mismatch"; exit 1; }
          echo "KIT=$D" >> "$GITHUB_ENV"
      - run: pip install --quiet pyyaml
      - name: rebase agent PRs
        run: python "$KIT/runtime/rebase.py" --config .autopilot/repo.yaml

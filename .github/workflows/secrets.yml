# autopilot-kit reusable workflow: required status check "secrets". Deterministic, zero tokens, stdlib only.
# The logic comes from the pinned kit sha (a PR cannot weaken it); the allowlist is read from the base branch only, so a PR
# cannot allowlist the secret it adds. Findings name file, line and rule id, never the matched value.
name: secrets

on:
  workflow_call:
    inputs:
      kit_repo: {type: string, required: true}
      kit_ref:  {type: string, required: true}

permissions: {}

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: fetch kit (pinned, verified)
        env:
          KIT_REPO: ${{ inputs.kit_repo }}
          KIT_REF: ${{ inputs.kit_ref }}
        run: |
          case "$KIT_REF" in ""|*[!0-9a-f]*) echo "::error::kit_ref must be a full commit sha"; exit 1;; esac
          [ "${#KIT_REF}" = 40 ] || { echo "::error::kit_ref must be 40 hex chars"; exit 1; }
          case "$KIT_REPO" in */*) ;; *) echo "::error::kit_repo must be owner/name"; exit 1;; esac
          D="$RUNNER_TEMP/kit"
          git init -q "$D"
          git -C "$D" fetch -q --depth 1 "https://github.com/${KIT_REPO}.git" "$KIT_REF"
          git -C "$D" checkout -q FETCH_HEAD
          [ "$(git -C "$D" rev-parse HEAD)" = "$KIT_REF" ] || { echo "::error::kit sha mismatch"; exit 1; }
          echo "KIT=$D" >> "$GITHUB_ENV"
      - name: run secret scan
        run: |
          # base-branch allowlist only; no fallback to the PR's copy (a missing file is an empty allowlist)
          git show "origin/$BASE_REF:.autopilot/secretscan-allow.txt" > "$RUNNER_TEMP/secretscan-allow.txt" 2>/dev/null || : > "$RUNNER_TEMP/secretscan-allow.txt"
          python "$KIT/runtime/secretscan.py" --base "origin/$BASE_REF" --head HEAD --allowlist "$RUNNER_TEMP/secretscan-allow.txt"
